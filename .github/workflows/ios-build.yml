name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Quasar
        run: npm run build

      - name: Setup CocoaPods
        run: pod install --project-directory=src-capacitor/ios/App

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS Project
        run: |
          xcodebuild -workspace src-capacitor/ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -derivedDataPath build \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: build/Build/Products/Release-iphoneos/
