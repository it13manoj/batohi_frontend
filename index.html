<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="UTF-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://unpkg.com;
    style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
    img-src 'self' data: blob: http://localhost:3300 https://*.tile.openstreetmap.org https://unpkg.com https://placehold.co https://*.placehold.co;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self'
      http://localhost:3300
      ws://localhost:3300
      wss://localhost:3300
      ws://api.batohidriver.com
      wss://api.batohidriver.com
      https://api.batohidriver.com
      https://router.project-osrm.org
      https://nominatim.openstreetmap.org
      https://*.tile.openstreetmap.org
      https://firebaseinstallations.googleapis.com
      https://fcmregistrations.googleapis.com
      https://fcm.googleapis.com;
    media-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  "
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Noto Sans Devanagari & Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
